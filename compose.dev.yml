services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    command: npm run dev:api
    environment:
      PORT: 3000
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      AUDIOTOOL_PAT: ${AUDIOTOOL_PAT:-}
      AUDIOTOOL_CLIENT_ID: ${AUDIOTOOL_CLIENT_ID:-}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    command: npm run dev --workspace @midi-to-xml/web -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_AUDIOTOOL_CLIENT_ID: ${VITE_AUDIOTOOL_CLIENT_ID:-}
      VITE_AUDIOTOOL_REDIRECT_URL: ${VITE_AUDIOTOOL_REDIRECT_URL:-}
      VITE_AUDIOTOOL_SCOPE: ${VITE_AUDIOTOOL_SCOPE:-project:write}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/usr/src/app
      - web_node_modules:/usr/src/app/node_modules

volumes:
  api_node_modules:
  web_node_modules:
