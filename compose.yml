services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      MUSESCORE_BIN: ${MUSESCORE_BIN:-}
      MUSESCORE_USE_XVFB: ${MUSESCORE_USE_XVFB:-auto}
      XVFB_RUN_BIN: ${XVFB_RUN_BIN:-xvfb-run}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      CONVERSION_TIMEOUT_MS: ${CONVERSION_TIMEOUT_MS:-120000}
      DEFAULT_QUANTIZATION_GRID: ${DEFAULT_QUANTIZATION_GRID:-48}
      AUDIOTOOL_PAT: ${AUDIOTOOL_PAT:-}
      AUDIOTOOL_CLIENT_ID: ${AUDIOTOOL_CLIENT_ID:-}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AUDIOTOOL_CLIENT_ID: ${VITE_AUDIOTOOL_CLIENT_ID:-}
        VITE_AUDIOTOOL_REDIRECT_URL: ${VITE_AUDIOTOOL_REDIRECT_URL:-}
        VITE_AUDIOTOOL_SCOPE: ${VITE_AUDIOTOOL_SCOPE:-project:read}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
